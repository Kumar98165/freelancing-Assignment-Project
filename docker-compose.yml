version: '3.8'

services:
  # Flask Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tzsuperpos_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - SECRET_KEY=tzsuperpos_secret_jwt_key_2026
    volumes:
      - ./backend:/app
    restart: always

  # React Vite Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tzsuperpos_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always

networks:
  default:
    name: tzsuperpos_network
